name: NOVIQ Screenshot

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'backend/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm init -y
          npm install playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Start NOVIQ
        run: |
          python3 -m http.server 4173 > /tmp/noviq-server.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/noviq-server.log
          exit 1
      - name: Capture real mobile render
        run: |
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            viewport: { width: 390, height: 844 },
            deviceScaleFactor: 3,
            isMobile: true,
            hasTouch: true,
            userAgent: 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148'
          });
          const page = await context.newPage();
          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
          await page.waitForTimeout(2500);
          await page.screenshot({ path: 'noviq-live-iphone.png', fullPage: true });
          await browser.close();
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: noviq-live-screenshot
          path: noviq-live-iphone.png
          if-no-files-found: error
