name: NOVIQ E2E

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'backend/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decision-loop:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned test dependencies
        run: npm install --ignore-scripts
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Start NOVIQ
        run: |
          python3 -m http.server 4173 > /tmp/noviq-server.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/noviq-server.log
          exit 1
      - name: Run persisted local and cloud identity workflows
        env:
          BROWSER: ${{ matrix.browser }}
        run: node tests/e2e-v611.mjs
